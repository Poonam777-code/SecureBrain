<!DOCTYPE html>

<html>
<head>
<title>Blocked Websites</title>

<style>

body{
background:#cfd8d3;
font-family:Arial;
text-align:center;
}

h2{
margin-top:40px;
}

table{
margin:auto;
margin-top:30px;
border-collapse:collapse;
width:60%;
background:white;
}

th,td{
padding:12px;
border:1px solid #ccc;
}

th{
background:#333;
color:white;
}

button{
padding:6px 12px;
background:#e74c3c;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#c0392b;
}

</style>

</head>

<body>

<h2>🚫 Blocked Websites</h2>

<table id="blockedTable">
<tr>
<th>Website</th>
<th>Action</th>
</tr>
</table>

<script>

function loadBlockedSites(){

let blocked=JSON.parse(localStorage.getItem("blocked_sites"))||[];

let table=document.getElementById("blockedTable");

blocked.forEach(site=>{

let row=table.insertRow();

let cell1=row.insertCell(0);
let cell2=row.insertCell(1);

cell1.innerHTML=site;

cell2.innerHTML='<button onclick="unblockSite(\''+site+'\')">Unblock</button>';

});

}

function unblockSite(site){

let blocked=JSON.parse(localStorage.getItem("blocked_sites"))||[];

blocked=blocked.filter(s=>s!==site);

localStorage.setItem("blocked_sites",JSON.stringify(blocked));

alert("Website unblocked");

location.reload();

}

loadBlockedSites();

</script>

</body>
</html>
