<!DOCTYPE html>
<html>
<head>
    <title>Activity Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<h2>Activity Log</h2>
<table>
<tr>
<th>ID</th>
<th>URL</th>
<th>Risk</th>
<th>Status</th>
<th>Time</th>
</tr>
{% for log in logs %}
<tr>
<td>{{log[0]}}</td>
<td>{{log[1]}}</td>
<td>{{log[2]}}</td>
<td>{{log[3]}}</td>
<td>{{log[4]}}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
