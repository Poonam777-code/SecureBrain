<h1>SecureBrain</h1>
<p class="subtitle">Private. Secure. Yours.</p>

<!-- SEARCH BOX -->
<div class="search-box">
    <input id="searchInput" placeholder="Search privately..." />
    <button onclick="handleSearch()">Search</button>

    Your search will be answered by our AI assistant
</p>

    <!-- AI ASSISTANT -->
    <button class="secondary-btn"

    </button>

    <button class="secondary-btn" onclick="openUrlCheckPage()">

    </button>

```

</div>

<script>

/* OPEN URL CHECK PAGE */
function openUrlCheckPage() {
    window.location.href = "/url-check";
}


/* SEARCH BOX FUNCTION */
function handleSearch() {

    let query = document.getElementById("searchInput").value.trim();

    if(query === ""){
        alert("Please enter something to search");
        return;
    }

    /* detect if user typed a URL */
    let isURL = query.includes(".") && !query.includes(" ");

    if(isURL){

        /* redirect to SecureBrain URL checker */
        window.location.href = "/url-check?target=" + encodeURIComponent(query);

    }
    else{

        /* open private search */
        let searchURL = "https://duckduckgo.com/?q=" + encodeURIComponent(query);

        window.open(searchURL,"_blank");

    }

}


/* ENTER KEY SEARCH */
document.getElementById("searchInput").addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        handleSearch();
    }

});

</script>

</body>
