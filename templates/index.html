<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureBrain</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="brand">🛡 SecureBrain</div>
    <div class="private-mode">🟢 Private Mode</div>
</div>

<!-- CENTER -->
<div class="center-container">

    <div class="shield">🛡️</div>

    <h1>SecureBrain</h1>
    <p class="subtitle">Private. Secure. Yours.</p>

    <!-- SEARCH -->
    <div class="search-box">
        <input id="searchInput" placeholder="Search privately..." />
        <button onclick="handleSearch()">Search</button>
    </div>

    <p class="assistant-text">
        Your search will be answered by our AI assistant
    </p>

    <!-- URL CHECK BUTTON -->
    <div class="url-check-box">
        <button onclick="window.location.href='/url-check'">
            🛡 Check URL Safety
        </button>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-buttons">

        <button class="secondary-btn"
        onclick="window.open('/chatbot','SecureBrainChat','width=1100,height=750,resizable=yes,scrollbars=yes')">
        🤖 AI Assistant
        </button>

        <button class="secondary-btn"
        onclick="window.location.href='/blocked-sites'">
        🔒 View Blocked Sites
        </button>

    </div>

    <!-- FEATURES -->
    <div class="feature-row">
        <div class="feature">🟢 Private Mode</div>
        <div class="feature">📂 History stored locally</div>
        <div class="feature">🚫 No Tracking</div>
        <div class="feature">🔒 Encrypted AI</div>
    </div>

</div>

<script>
function handleSearch() {
    let query = document.getElementById("searchInput").value.trim();

    if (!query) {
        alert("Please enter something to search");
        return;
    }

    window.location.href = "/secure-search-page?query=" + encodeURIComponent(query);
}

document.getElementById("searchInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") handleSearch();
});
</script>

</body>
</html>
