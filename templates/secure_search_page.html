<!DOCTYPE html>
<html>
<head>
    <title>SecureBrain - Search Results</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* ===== PAGE LAYOUT ===== */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg,#edf3f0,#d9e7e2);
            color: #000;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

        .navbar {
            display:flex;
            justify-content:space-between;
            padding:15px 40px;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.05);
        }
        .brand { font-weight:600; color:#2ecc71; font-size:20px; }
        .private-mode { background:#2ecc71; color:white; padding:6px 14px; border-radius:20px; font-size:14px; }

        .center-container {
            max-width: 1100px;
            margin: 30px auto;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom: 25px;
        }
        .search-bar input {
            flex:1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline:none;
            transition: all 0.4s ease-in-out;
        }
        .search-bar input:focus {
            border-color:#2ecc71;
            box-shadow:0 0 10px rgba(46,204,113,0.5);
        }
        .search-bar button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            background:#2ecc71;
            color:white;
            font-weight:600;
            cursor:pointer;
            transition: all 0.3s ease;
            animation: pulseButton 2s infinite;
        }
        .search-bar button:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow:0 6px 18px rgba(46,204,113,0.4);
        }
        @keyframes pulseButton {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* ===== TABS ===== */
        .tabs {
            display:flex;
            gap:20px;
            margin-bottom:20px;
            flex-wrap: wrap;
        }
        .tab {
            padding:8px 15px;
            border-radius:20px;
            cursor:pointer;
            background:#f5f5f5;
            transition:all 0.3s ease;
        }
        .tab.active, .tab:hover {
            background:#2ecc71;
            color:white;
            transform: scale(1.05);
        }

        /* ===== RESULTS ===== */
        .results { display:flex; flex-direction:column; gap:20px; align-items:center; }

        .result-card {
            background:#fff;
            width:90%;
            max-width:900px;
            text-align:left;
            padding:15px 20px;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            transition:0.3s;
            border-left:4px solid #2ecc71;
            opacity:0;
            transform: translateY(20px);
            animation: fadeUp 0.6s forwards;
        }
        .result-card:hover {
            box-shadow:0 6px 20px rgba(0,0,0,0.15);
        }
        .result-card a {
            font-size:18px;
            color:#1a0dab;
            font-weight:500;
            text-decoration:none;
        }
        .result-card a:hover { text-decoration:underline; }
        .result-card .link-url {
            font-size:14px;
            color:#006621;
            margin:3px 0;
        }
        .result-card .snippet {
            font-size:14px;
            color:#545454;
            line-height:1.4;
        }

        @keyframes fadeUp { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }

    </style>
</head>
<body>
<div class="navbar">
    <div class="brand">SecureBrain</div>
    <div class="private-mode">🟢 Private Mode</div>
</div>

<div class="center-container">
    <!-- SEARCH BAR -->
    <div class="search-bar">
        <input id="searchInput" placeholder="Search..." value="{{ query }}">
        <button onclick="doSearch()">Search</button>
        <button onclick="toggleAIMode()">🤖 AI Mode</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
        {% for tab_name in results_by_tab.keys() %}
            <div class="tab {% if loop.index0 == 0 %}active{% endif %}" data-tab="{{ tab_name }}">{{ tab_name|capitalize }}</div>
        {% endfor %}
    </div>

    <!-- RESULTS -->
    <div class="results" id="results">
        {% for tab_name, results in results_by_tab.items() %}
            <div class="tab-results" data-tab="{{ tab_name }}" {% if not loop.first %}style="display:none"{% endif %}>
                {% for result in results %}
                    <div class="result-card">
                        <a href="{{ result.link }}" target="_blank">{{ result.title }}</a>
                        <div class="link-url">{{ result.link }}</div>
                        <div class="snippet">{{ result.snippet }}</div>
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
    </div>
</div>

<script>
// Switch tabs
const tabs = document.querySelectorAll(".tab");
tabs.forEach(tab => {
    tab.addEventListener("click", () => {
        const tabName = tab.dataset.tab;

        // Highlight selected tab
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        // Show corresponding results
        document.querySelectorAll(".tab-results").forEach(div => {
            div.style.display = div.dataset.tab === tabName ? "block" : "none";
        });
    });
});

// Search button
function doSearch() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) { alert("Please enter a search query"); return; }

    // Redirect to Flask route for secure search
    window.location.href = `/secure-search-page?query=${encodeURIComponent(query)}&ai_mode=True`;
}

// AI Mode toggle (for now alert)
function toggleAIMode() {
    alert("AI Mode Activated!");
}
</script>

</body>
</html>
