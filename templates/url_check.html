<!DOCTYPE html>
<html>
<head>

<title>URL Safety Checker</title>

<style>

/* ===== BODY ===== */
body{
    margin:0;
    font-family:Arial;

    background: linear-gradient(-45deg, #eefaf4, #e6f7ef, #f3fcf8, #f7fffb);
    background-size: 400% 400%;
    animation: gradientMove 16s ease infinite;

    color:#2f3e34;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ===== CONTAINER ===== */
.url-check-container{
    width:420px;
    margin:120px auto;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(8px);

    padding:30px;
    border-radius:20px;
    text-align:center;

    box-shadow: 0 10px 25px rgba(0,0,0,0.05);

    animation: floatCard 6s ease-in-out infinite;
}

@keyframes floatCard{
    0%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
    100%{transform:translateY(0);}
}

/* ===== TITLE ===== */
.url-check-container h2{
    color:#34c77b;
    margin-bottom:20px;
}

/* ===== INPUT ===== */
.url-check-container input{
    width:90%;
    padding:12px;
    border-radius:30px;
    border:1px solid #d6eee3;
    margin-bottom:18px;

    background:#ffffff;
    outline:none;
    transition:0.3s;
}

.url-check-container input:focus{
    border-color:#34c77b;
    box-shadow:0 0 8px rgba(52,199,123,0.3);
}

/* ===== GREEN BUTTON (MAIN FIX) ===== */
.url-check-container button{
    padding:12px 28px;

    background: linear-gradient(135deg, #34c77b, #2fbf72);

    border:none;
    border-radius:30px;

    color:white;
    font-weight:600;
    font-size:14px;

    cursor:pointer;
    transition: all 0.25s ease;

    box-shadow: 0 4px 12px rgba(52,199,123,0.25);
}

/* hover */
.url-check-container button:hover{
    transform: translateY(-2px) scale(1.05);

    box-shadow:
        0 8px 20px rgba(52,199,123,0.35),
        0 0 10px rgba(52,199,123,0.2);
}

/* click */
.url-check-container button:active{
    transform: scale(0.96);
    box-shadow: 0 3px 8px rgba(52,199,123,0.2);
}

</style>

</head>

<body>

<div class="url-check-container">

<h2>🛡 URL Safety Checker</h2>

<input type="text" id="urlInput" placeholder="Enter URL">

<br>

<button onclick="checkURL()">Check</button>

</div>

<script>

function getBlockedSites(){
return JSON.parse(localStorage.getItem("blocked_sites")) || [];
}

function saveBlockedSite(url){
let blocked=getBlockedSites();
if(!blocked.includes(url)){
blocked.push(url);
localStorage.setItem("blocked_sites",JSON.stringify(blocked));
}
}

function unblockSite(url){
let blocked=getBlockedSites();
blocked=blocked.filter(site=>site!==url);
localStorage.setItem("blocked_sites",JSON.stringify(blocked));
alert("Website unblocked");
}

function checkURL(){
let url=document.getElementById("urlInput").value.trim();

if(!url){
alert("Enter URL");
return;
}

if(!url.startsWith("http")){
url="http://"+url;
}

let blocked=getBlockedSites();

if(blocked.includes(url)){
let choice=confirm(
"🚫 This website is blocked.\n\nPress OK to unblock and open.\nPress Cancel to stay blocked."
);

if(choice){
unblockSite(url);
window.open(url,"_blank");
}

return;
}

fetch("/check_url",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({url:url})
})
.then(res=>res.json())
.then(data=>{

let reasons=data.reasons.join("\n");

let message=
"Security Level: "+data.security_level+
"\nRisk Score: "+data.risk_score+
"\n\nIssues Detected:\n"+reasons;

if(data.security_level==="Safe" || data.security_level==="Very Secure"){

alert("✅ SAFE WEBSITE\n\n"+message);
window.open(url,"_blank");

}else{

let userChoice=confirm(
"⚠ Website may be unsafe!\n\n"+
message+
"\n\nOK = Proceed with caution\nCancel = Block Website"
);

if(userChoice){
window.open(url,"_blank");
}else{
saveBlockedSite(url);
alert("🚫 Website blocked and saved locally.");
}
}

})
.catch(()=>{
alert("Error checking URL");
});
}

</script>

</body>
</html>
